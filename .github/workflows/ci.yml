name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      # Real-data tests skip automatically when data is absent.
      - run: uv run pytest -q

  data:
    name: Real-data ingestion and tests (Metrica sample)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache raw provider data (checksum-verified on use)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('src/footymind/data/sources.py') }}
      - run: uv run footymind download metrica-sample-1 metrica-sample-2
      - run: uv run footymind ingest
      - run: uv run pytest -q

  legacy:
    name: Legacy v1 predictor (historical reproduction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn joblib fastapi pytest matplotlib seaborn
      - run: cd legacy/match_outcome_predictor && PYTHONPATH=. pytest -q tests
