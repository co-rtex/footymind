name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      # Real-data tests skip automatically when data is absent.
      - run: uv run pytest -q

  data:
    name: Real-data ingestion and tests (Metrica sample)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache raw provider data (checksum-verified on use)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('src/footymind/data/sources.py') }}
      # Metrica only (~180 MB); SkillCorner (~1.8 GB) is too large for every CI run.
      - run: uv run footymind download metrica-sample-1 metrica-sample-2 metrica-sample-3
      - run: uv run footymind ingest metrica-sample-1 metrica-sample-2 metrica-sample-3
      - run: uv run pytest -q

  legacy:
    name: Legacy v1 predictor (historical reproduction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn joblib fastapi pytest matplotlib seaborn
      - run: cd legacy/match_outcome_predictor && PYTHONPATH=. pytest -q tests

  web:
    name: Web typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  docker:
    name: Docker image builds, starts and serves (Metrica sample)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: footymind:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # First start on an EMPTY volume, as documented: the entrypoint downloads two Metrica games
      # (checksum-verified, ~120 MB), ingests them and builds the similar-moments index; then the
      # smoke checks call the real API (analysis, scenario with a response policy, similar moments
      # with the validated estimate) and the web lab. No data is faked or baked into the image.
      - name: Start the container
        run: |
          docker run -d --name fm -p 127.0.0.1:8000:8000 -v fm-data:/data \
            -e FOOTYMIND_SOURCES="metrica-sample-1 metrica-sample-2" footymind:ci
      - name: Smoke-check the running container
        run: |
          python3 scripts/smoke_api.py http://127.0.0.1:8000 --wait 900 \
            --expect-matches metrica-sample-1 metrica-sample-2 --require-similar
      - name: Docker HEALTHCHECK reports healthy
        run: |
          timeout 120 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" fm)" = healthy ]; do sleep 3; done'
      - name: Container logs
        if: always()
        run: docker logs fm 2>&1 | tail -n 100; docker rm -f fm || true
