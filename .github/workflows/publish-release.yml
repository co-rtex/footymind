name: Publish FootyMind v1.0.0

# Publish only after the release merge commit passes the complete main-branch CI.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out CI-verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish one-time 1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --format=%s)" != "release: FootyMind v1.0.0" ]]; then
            echo "Not the designated v1.0.0 merge commit; skipping."
            exit 0
          fi
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release already published; skipping."
            exit 0
          fi
          gh release create v1.0.0 \
            --target "$RELEASE_SHA" \
            --title "FootyMind v1.0.0" \
            --notes-file docs/release/RELEASE_NOTES_1.0.md \
            --latest
